services:
  mongo:
    image: mongo:7
    container_name: petmory-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: petmory-mongo-ui
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # Noi thang vao container mongo. Replica set ghi ten may la localhost, ten do chi
      # dung duoc tu may that, con trong container nay no tro ve chinh container.
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo-data:
