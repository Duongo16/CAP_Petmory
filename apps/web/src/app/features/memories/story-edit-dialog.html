<form class="sheet" (ngSubmit)="save()">
  <header class="sheet-head">
    <div>
      <p class="eyebrow">{{ 'STORY.TITLE' | translate }}</p>
      <h2 class="sheet-title">{{ 'STORY.EDIT_TITLE' | translate }}</h2>
    </div>
    <button type="button" class="shut" (click)="close()" [attr.aria-label]="'COMMON.CLOSE' | translate">
      <pm-icon name="close" [size]="17" />
    </button>
  </header>

  <div class="sheet-body">
    <div class="field">
      <label class="field-name" for="story-title">{{ 'STORY.EDIT_TITLE' | translate }}</label>
      <input
        id="story-title"
        type="text"
        name="editTitle"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
      />
    </div>

    <div class="field">
      <label class="field-name" for="story-content">{{ 'STORY.EDIT_CONTENT' | translate }}</label>
      <textarea
        id="story-content"
        rows="16"
        name="editContent"
        [ngModel]="content()"
        (ngModelChange)="content.set($event)"
      ></textarea>
    </div>
  </div>

  <footer class="sheet-foot">
    <button type="button" class="plain" (click)="close()">{{ 'COMMON.CANCEL' | translate }}</button>
    <button type="submit" class="strong" id="story-save" [disabled]="!canSave()">
      {{ 'COMMON.SAVE' | translate }}
      <pm-icon name="check" [size]="15" />
    </button>
  </footer>
</form>
