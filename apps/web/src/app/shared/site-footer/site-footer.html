<footer class="mt-16 bg-night text-on-night" [class.bottom-nav-room]="bottomNavRoom()">
  <div class="grid gap-10 max-w-[1180px] mx-auto px-6 pt-12 pb-8 box-border [grid-template-columns:repeat(auto-fit,minmax(220px,1fr))]">

    <!-- Brand column -->
    <div class="flex flex-col items-start gap-3">
      <pm-brand size="md" />
      <p class="m-0 font-serif italic text-base leading-relaxed">{{ 'FOOTER.TAGLINE' | translate }}</p>
      <p class="m-0 text-sm text-on-night/70">{{ 'FOOTER.SLOGAN' | translate }}</p>
    </div>

    <!-- Explore nav -->
    <nav class="flex flex-col items-start gap-2.5" [attr.aria-label]="'FOOTER.EXPLORE' | translate">
      <h2 class="m-0 mb-2 text-xs font-bold tracking-[0.1em] uppercase text-on-night/70">
        {{ 'FOOTER.EXPLORE' | translate }}
      </h2>
      <div class="grid grid-cols-2 gap-x-8 gap-y-2.5">
        @for (item of menu(); track item.path) {
          <a
            class="text-on-night/85 no-underline text-sm transition-colors hover:text-on-night hover:underline"
            [routerLink]="item.path"
          >{{ item.key | translate }}</a>
        }
      </div>
    </nav>

    <!-- Social links -->
    <div id="footer-contact" tabindex="-1" class="footer-contact flex flex-col items-start gap-3">
      <h2 class="m-0 mb-1 text-xs font-bold tracking-[0.1em] uppercase text-on-night/70">
        {{ 'FOOTER.FOLLOW' | translate }}
      </h2>
      <pm-social-links variant="full" />
    </div>
  </div>
  <div class="max-w-[1180px] mx-auto px-6 pb-8 box-border">
    <p class="m-0 pt-5 border-t border-on-night/15 text-xs text-on-night/60">{{ 'FOOTER.RIGHTS' | translate }}</p>
  </div>
</footer>
