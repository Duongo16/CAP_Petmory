<header class="lp-bar">
  <div class="lp-bar-inner">
    <a class="lp-brand" routerLink="/landing">
      <pm-brand size="md" />
    </a>
    <nav class="lp-nav" [attr.aria-label]="'NAV.MAIN' | translate">
      <a routerLink="/shop">{{ 'NAV.SHOP' | translate }}</a>
      <a routerLink="/login" [queryParams]="{ continue: '/journals' }">{{ 'LANDING.NAV_DIARY' | translate }}</a>
      <a routerLink="/login" [queryParams]="{ continue: '/journals' }">{{ 'LANDING.NAV_MEMORY' | translate }}</a>
      <a routerLink="/diaries">{{ 'LANDING.NAV_PUBLIC' | translate }}</a>
    </nav>
    <div class="lp-bar-actions">
      <pm-language-toggle />
      <pm-theme-toggle />
      <a class="lp-link-btn" routerLink="/login">{{ 'AUTH.SIGN_IN' | translate }}</a>
      <a class="lp-btn lp-btn-sm" routerLink="/register">{{ 'LANDING.START_FREE' | translate }}</a>
    </div>
  </div>
</header>
